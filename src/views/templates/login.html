{% extends "base.html" %}
{% block title %}登入 - 自習室空位偵測系統{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-12 col-sm-9 col-md-6 col-lg-5">
    <div class="card login-card">
      <div class="card-body p-4">
        <h5 class="login-title mb-1">自習室空位偵測系統</h5>
        <p class="login-subtitle mb-4">以學號登入即可查看即時座位狀態並預約座位</p>
        {% if error %}
        <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}
        <form method="post" action="/login">
          <div class="mb-3">
            <label class="form-label" for="student_id">學號</label>
            <input class="form-control" id="student_id" name="student_id"
                   placeholder="例如 B11023001" required autofocus>
          </div>
          <button class="btn btn-primary w-100" type="submit">進入系統</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
