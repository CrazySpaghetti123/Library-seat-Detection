<!DOCTYPE html>
<!-- data-bs-theme 固定 dark：本系統為單一深色主題，Bootstrap 元件需此屬性才會套用深色樣式 -->
<html lang="zh-Hant" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}自習室空位偵測系統{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand app-navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="/map">📚 自習室空位系統</a>
      <div class="navbar-nav align-items-center ms-auto gap-2">
        {% block nav %}{% endblock %}
      </div>
    </div>
  </nav>
  <main class="container py-3">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
