<!DOCTYPE html>
<!-- data-bs-theme 固定 dark：本系統為單一深色主題，Bootstrap 元件需此屬性才會套用深色樣式 -->
<html lang="zh-Hant" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>登入 - 自習室空位偵測系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <nav class="navbar navbar-expand app-navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">📚 自習室空位系統</a>
    </div>
  </nav>
  <main class="container py-3">
    <div class="row justify-content-center mt-5">
      <div class="col-12 col-sm-9 col-md-6 col-lg-5">
        <div class="card login-card">
          <div class="card-body p-4">
            <h5 class="login-title mb-1">自習室空位偵測系統</h5>
            <p class="login-subtitle mb-4">以學號登入即可查看即時座位狀態並預約座位</p>
            <div id="login-error" class="alert alert-danger py-2 d-none" role="alert"></div>
            <form id="login-form" novalidate>
              <div class="mb-3">
                <label class="form-label" for="student_id">學號</label>
                <input class="form-control" id="student_id" name="student_id"
                       placeholder="例如 B11023001" autocomplete="username" required autofocus>
              </div>
              <button class="btn btn-primary w-100" id="login-submit" type="submit">進入系統</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script>
    (() => {
      // 已登入就直接進平面圖
      if (App.auth.token()) {
        location.replace("map.html");
        return;
      }
      const form = document.getElementById("login-form");
      const error = document.getElementById("login-error");
      const submit = document.getElementById("login-submit");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        error.classList.add("d-none");
        submit.disabled = true;
        try {
          const { res, data } = await App.json("/api/auth/login", {
            method: "POST",
            body: { student_id: document.getElementById("student_id").value },
          });
          if (res.ok) {
            App.auth.save(data.token, data.student_id);
            location.replace("map.html");
            return;
          }
          error.textContent = data.detail || "登入失敗";
          error.classList.remove("d-none");
        } catch {
          // 喚醒逾時：提示已由 App 顯示
        } finally {
          submit.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
