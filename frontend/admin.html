<!DOCTYPE html>
<!-- data-bs-theme 固定 dark：本系統為單一深色主題，Bootstrap 元件需此屬性才會套用深色樣式 -->
<html lang="zh-Hant" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>使用率報表 - 自習室空位偵測系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <nav class="navbar navbar-expand app-navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="map.html">📚 自習室空位系統</a>
      <div class="navbar-nav align-items-center ms-auto gap-2">
        <a class="nav-link" href="map.html">回平面圖</a>
      </div>
    </div>
  </nav>
  <main class="container py-3">
<div class="mb-3">
  <h5 class="mb-1">校園空間使用率報表</h5>
  <div class="text-secondary small">開放時段 <span id="open-hours">–</span>（<span id="report-tz">當地時間</span>）</div>
</div>

<!-- 管理密碼：第一次查詢前或密碼錯誤時顯示（spec: access-control / Administrator Authentication） -->
<div class="card mb-3 d-none" id="admin-auth">
  <div class="card-body">
    <form id="admin-form" class="row g-2 align-items-end">
      <div class="col-12 col-md-6">
        <label class="form-label" for="admin-token">管理密碼</label>
        <input class="form-control" type="password" id="admin-token" autocomplete="current-password" required>
      </div>
      <div class="col-12 col-md-3">
        <button class="btn btn-primary w-100" type="submit">確認</button>
      </div>
      <div class="col-12 small text-danger d-none" id="admin-error">管理密碼錯誤，請重新輸入</div>
    </form>
  </div>
</div>

<div class="card mb-3">
  <div class="card-body">
    <form id="query-form" class="row g-3 align-items-end">
      <div class="col-6 col-md-3">
        <label class="form-label" for="start">起始日期</label>
        <input class="form-control" type="date" id="start" required>
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label" for="end">結束日期</label>
        <input class="form-control" type="date" id="end" required>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label" for="floor">樓層</label>
        <input class="form-control" id="floor" placeholder="全部">
      </div>
      <div class="col-6 col-md-4 d-flex gap-2">
        <button class="btn btn-primary" type="submit">查詢</button>
        <button class="btn btn-outline-secondary" id="csv-button" type="button">匯出 CSV</button>
      </div>
    </form>
  </div>
</div>

<div id="no-data" class="alert alert-secondary d-none">該區間無資料</div>

<!-- KPI 數據列：由 dashboard.js 於查詢後填值 -->
<div class="d-flex flex-wrap gap-3 mb-3">
  <div class="stat-tile">
    <span class="stat-label">尖峰時段</span>
    <span class="stat-value" id="kpi-peak">–</span>
  </div>
  <div class="stat-tile">
    <span class="stat-label">佔位逾時釋放</span>
    <span class="stat-value" id="kpi-released">–</span>
  </div>
  <div class="stat-tile">
    <span class="stat-label">平均離席時長</span>
    <span class="stat-value" id="kpi-avg-away">–</span>
  </div>
</div>

<div class="row g-3">
  <div class="col-12 col-lg-6">
    <div class="card h-100">
      <div class="card-header">逐時使用率（結束日期當日）</div>
      <div class="card-body"><canvas id="chart-hourly"></canvas></div>
    </div>
  </div>
  <div class="col-12 col-lg-6">
    <div class="card h-100">
      <div class="card-header">每日使用率趨勢</div>
      <div class="card-body"><canvas id="chart-trend"></canvas></div>
    </div>
  </div>
  <div class="col-12 col-lg-6">
    <div class="card h-100">
      <div class="card-header">樓層比較（區間平均）</div>
      <div class="card-body"><canvas id="chart-floors"></canvas></div>
    </div>
  </div>
  <div class="col-12 col-lg-6">
    <div class="card h-100">
      <div class="card-header">佔位行為統計</div>
      <div class="card-body" id="idle-stats">尚未查詢</div>
    </div>
  </div>
</div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
