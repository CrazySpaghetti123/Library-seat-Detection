<!DOCTYPE html>
<!-- data-bs-theme 固定 dark：本系統為單一深色主題，Bootstrap 元件需此屬性才會套用深色樣式 -->
<html lang="zh-Hant" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>座位平面圖 - 自習室空位偵測系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <!-- 未登入不渲染頁面，直接回登入頁 -->
  <script>App.auth.requireLogin();</script>
</head>
<body>
  <nav class="navbar navbar-expand app-navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="map.html">📚 自習室空位系統</a>
      <div class="navbar-nav align-items-center ms-auto gap-2">
        <span class="navbar-text me-2"><span class="d-none d-sm-inline">學號：</span><span id="nav-student"></span></span>
        <a class="nav-link" href="index.html" id="logout-link">登出</a>
      </div>
    </div>
  </nav>
  <main class="container py-3">
<!-- 常駐通知（離席警示等需要使用者處理的訊息） -->
<div id="notification-area"></div>

<!-- 操作回饋：左下角浮出的短暫提示 -->
<div id="toast-area" class="toast-area" aria-live="polite"></div>

<div class="d-flex flex-wrap align-items-center gap-3 mb-3">
  <h5 class="mb-0 me-auto">自習室平面圖</h5>
  <div class="stat-tile">
    <span class="stat-label">目前可預約</span>
    <span class="stat-value is-available"><span id="available-count">–</span> 席</span>
  </div>
  <span id="ws-status" class="conn-badge is-connecting">
    <span class="conn-dot" aria-hidden="true"></span>
    <span id="ws-status-text">連線中…</span>
  </span>
</div>

<!-- 我的座位狀態列 -->
<div id="my-booking" class="alert alert-info py-2 d-none"></div>

<div class="map-stage">
  <div class="card">
    <div class="card-body p-2">
      <svg id="floor-map" viewBox="0 0 640 360" class="w-100" role="img"
           aria-label="自習室座位平面圖"></svg>
    </div>
    <div class="card-footer">
      <div class="legend">
        <span class="legend-item">
          <span class="legend-dot bg-seat-available" aria-hidden="true">✓</span> 可預約
        </span>
        <span class="legend-item">
          <span class="legend-dot bg-seat-busy" aria-hidden="true">●</span> 使用中／已預約
        </span>
        <span class="legend-item">
          <span class="legend-dot bg-seat-away" aria-hidden="true">⏱</span> 疑似佔位
        </span>
        <span class="legend-item">
          <span class="legend-dot bg-seat-maintenance" aria-hidden="true">✕</span> 維修中
        </span>
      </div>
    </div>
  </div>
</div>

<!-- 即時動態：收合式側欄（spec: Live Status Event Stream） -->
<button id="stream-toggle" class="stream-toggle" type="button"
        aria-expanded="false" aria-controls="stream-panel">
  <span class="stream-arrow" aria-hidden="true">‹</span>
  <span class="live-dot" aria-hidden="true"></span>
  <span>即時動態</span>
  <span class="stream-unread" id="stream-unread" aria-hidden="true"></span>
</button>

<aside id="stream-panel" class="stream-panel" aria-label="座位狀態變更即時動態">
  <div class="stream-panel-header">
    <span class="live-dot" aria-hidden="true"></span>
    <span>即時動態</span>
  </div>
  <ul id="event-stream" class="event-stream" aria-live="polite"></ul>
</aside>

<!-- 預約確認 Modal -->
<div class="modal fade" id="reserve-modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">預約座位 <span id="reserve-seat-label"></span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        預約後請於 <strong><span id="checkin-minutes">30</span> 分鐘</strong>內報到，逾期將自動釋放座位。
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button class="btn btn-primary" id="reserve-confirm">確認預約</button>
      </div>
    </div>
  </div>
</div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
